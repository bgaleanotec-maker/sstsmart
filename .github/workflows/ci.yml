name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Boot check
        run: |
          SCHEDULER_ENABLED=0 python -c "from app import create_app; create_app('development'); print('boot OK')"
      - name: Tests
        run: SCHEDULER_ENABLED=0 python -m pytest tests/ -q
