{% extends "admin/base.html" %}

{% block title %}Editar Dependencia - Admin SST{% endblock %}
{% block page_title %}Editar Dependencia{% endblock %}

{% block admin_content %}
<div class="max-w-4xl">
    <div class="panel p-8">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Nombre *</label>
                    <input type="text" name="nombre" value="{{ dependencia.nombre }}" required
                        class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Categoría *</label>
                    <select name="categoria_id" required
                        class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors">
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}" class="bg-fondo" {% if cat.id==dependencia.categoria_id
                            %}selected{% endif %}>
                            {{ cat.icono or '' }} {{ cat.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Descripción</label>
                <textarea name="descripcion"
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors"
                    rows="3">{{ dependencia.descripcion or '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Dirección</label>
                <input type="text" name="direccion" value="{{ dependencia.direccion or '' }}"
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Latitud</label>
                    <input type="number" name="latitud" step="0.000001" value="{{ dependencia.latitud or '' }}"
                        class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Longitud</label>
                    <input type="number" name="longitud" step="0.000001" value="{{ dependencia.longitud or '' }}"
                        class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-verde focus:outline-none transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Roles Vinculados</label>
                <div
                    class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-4 bg-superficie rounded-lg border border-linea">
                    {% for rol in roles %}
                    <label
                        class="flex items-center space-x-2 cursor-pointer hover:bg-fondo p-2 rounded transition-colors">
                        <input type="checkbox" name="roles" value="{{ rol.id }}" {% if rol in
                            dependencia.roles_vinculados %}checked{% endif %}
                            class="form-checkbox h-4 w-4 text-verde rounded bg-fondo border-linea focus:ring-green-500">
                        <span class="text-sm text-grafito-700">{{ rol.nombre }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div>
                <label
                    class="flex items-center space-x-3 cursor-pointer p-3 rounded-lg border border-linea bg-superficie hover:bg-superficie transition-colors">
                    <input type="checkbox" name="activa" {% if dependencia.activa %}checked{% endif %}
                        class="form-checkbox h-5 w-5 text-verde rounded bg-fondo border-linea focus:ring-green-500">
                    <span class="text-grafito-900 font-medium">Dependencia Activa</span>
                </label>
            </div>

            <div class="flex gap-4 pt-4 border-t border-linea">
                <button type="submit"
                    class="bg-verde text-white px-6 py-2 rounded-lg hover:bg-verde font-medium transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-save mr-2"></i> Guardar Cambios
                </button>
                <a href="{{ url_for('admin.listar_dependencias') }}"
                    class="px-6 py-2 rounded-lg text-grafito-500 hover:text-grafito-900 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
