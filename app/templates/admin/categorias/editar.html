{% extends "admin/base.html" %}

{% block title %}Editar Categoría - Admin SST{% endblock %}
{% block page_title %}Editar Categoría{% endblock %}

{% block admin_content %}
<div class="max-w-2xl">
    <div class="panel p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Nombre *</label>
                <input type="text" name="nombre" value="{{ categoria.nombre }}" required
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors">
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Descripción</label>
                <textarea name="descripcion"
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors"
                    rows="3">{{ categoria.descripcion or '' }}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Icono</label>
                    <input type="text" name="icono" value="{{ categoria.icono or '' }}"
                        class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Color</label>
                    <input type="color" name="color" value="{{ categoria.color }}"
                        class="w-full h-11 bg-fondo border border-linea rounded-lg cursor-pointer p-1">
                </div>
            </div>

            <div>
                <label
                    class="flex items-center space-x-3 cursor-pointer p-3 rounded-lg border border-linea bg-superficie hover:bg-superficie transition-colors">
                    <input type="checkbox" name="activa" {% if categoria.activa %}checked{% endif %}
                        class="form-checkbox h-5 w-5 text-azul rounded bg-fondo border-linea focus:ring-azul">
                    <span class="text-grafito-900 font-medium">Categoría Activa</span>
                </label>
            </div>

            <div class="flex gap-4 pt-4 border-t border-linea">
                <button type="submit"
                    class="bg-azul text-white px-6 py-2 rounded-lg hover:bg-azul font-medium transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-save mr-2"></i> Guardar Cambios
                </button>
                <a href="{{ url_for('admin.listar_categorias') }}"
                    class="px-6 py-2 rounded-lg text-grafito-500 hover:text-grafito-900 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
