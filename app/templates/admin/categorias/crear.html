{% extends "admin/base.html" %}

{% block title %}Nueva Categoría - Admin SST{% endblock %}
{% block page_title %}Nueva Categoría{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="glass-card p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Nombre *</label>
                <input type="text" name="nombre" required
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors"
                    placeholder="Ej: Industrial">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Descripción</label>
                <textarea name="descripcion"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors"
                    rows="3" placeholder="Describe esta categoría"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Icono (emoji)</label>
                    <input type="text" name="icono"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors"
                        placeholder="🏭">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Color</label>
                    <input type="color" name="color" value="#3b82f6"
                        class="w-full h-11 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer p-1">
                </div>
            </div>

            <div class="flex gap-4 pt-4 border-t border-white/10">
                <button type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-500 shadow-lg shadow-blue-500/20 font-medium transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-save mr-2"></i> Crear Categoría
                </button>
                <a href="{{ url_for('admin.listar_categorias') }}"
                    class="px-6 py-2 rounded-lg text-slate-400 hover:text-white transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
