{% extends "admin/base.html" %}

{% block page_title %}Editar Usuario{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 animate-fade-in">

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm text-slate-400">
        <a href="{{ url_for('admin.listar_usuarios') }}" class="hover:text-white transition-colors">Usuarios</a>
        <i class="fas fa-chevron-right text-xs"></i>
        <span class="text-white">Editar</span>
    </div>

    <div class="glass-card p-8">
        <h3 class="text-xl font-bold text-white mb-6 border-b border-white/10 pb-4">
            <i class="fas fa-user-edit text-blue-500 mr-2"></i> Editar Usuario
        </h3>

        <form method="POST" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nombre Completo -->
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nombre Completo</label>
                    <input type="text" name="nombre_completo" value="{{ usuario.nombre_completo }}" required
                        class="modern-input w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors">
                </div>

                <!-- Email -->
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ usuario.email }}" required
                        class="modern-input w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors">
                </div>

                <!-- Rol -->
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Rol Asignado</label>
                    <select name="rol" required
                        class="modern-input w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none transition-colors">
                        {% for rol in roles %}
                        <option value="{{ rol }}" class="bg-slate-900" {% if usuario.rol==rol %}selected{% endif %}>{{
                            rol }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Estado -->
                <div class="col-span-2">
                    <label
                        class="flex items-center space-x-3 cursor-pointer p-4 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition-colors">
                        <input type="checkbox" name="activo"
                            class="form-checkbox h-5 w-5 text-blue-600 rounded bg-slate-700 border-slate-600 focus:ring-blue-500 focus:ring-offset-slate-900"
                            {% if usuario.activo %}checked{% endif %}>
                        <span class="text-white font-medium">Usuario Activo</span>
                    </label>
                    <p class="text-xs text-slate-500 mt-2 ml-1">Si se desactiva, el usuario no podrá iniciar sesión.</p>
                </div>
            </div>

            <div class="pt-6 border-t border-white/10 flex justify-end gap-4">
                <a href="{{ url_for('admin.listar_usuarios') }}"
                    class="px-6 py-2 rounded-lg text-slate-400 hover:text-white transition-colors">Cancelar</a>
                <button type="submit"
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow-lg shadow-blue-500/20 font-medium transition-all transform active:scale-95">
                    Guardar Cambios
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
