{% extends "admin/base.html" %}

{% block page_title %}Editar Usuario{% endblock %}

{% block admin_content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm text-grafito-500">
        <a href="{{ url_for('admin.listar_usuarios') }}" class="hover:text-grafito-900 transition-colors">Usuarios</a>
        <i class="fas fa-chevron-right text-xs"></i>
        <span class="text-grafito-900">Editar</span>
    </div>

    <div class="panel p-8">
        <h3 class="text-xl font-bold text-grafito-900 mb-6 border-b border-linea pb-4">
            <i class="fas fa-user-edit text-azul mr-2"></i> Editar Usuario
        </h3>

        <form method="POST" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nombre Completo -->
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-grafito-500 mb-2">Nombre Completo</label>
                    <input type="text" name="nombre_completo" value="{{ usuario.nombre_completo }}" required
                        class="modern-input w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors">
                </div>

                <!-- Email -->
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-grafito-500 mb-2">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ usuario.email }}" required
                        class="modern-input w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors">
                </div>

                <!-- Rol -->
                <div class="col-span-2 md:col-span-1">
                    <label class="block text-xs font-bold text-grafito-500 mb-2">Rol Asignado</label>
                    <select name="rol" required
                        class="modern-input w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-azul focus:outline-none transition-colors">
                        {% for rol in roles %}
                        <option value="{{ rol }}" class="bg-fondo" {% if usuario.rol==rol %}selected{% endif %}>{{
                            rol }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Estado -->
                <div class="col-span-2">
                    <label
                        class="flex items-center space-x-3 cursor-pointer p-4 rounded-lg border border-linea bg-superficie hover:bg-superficie transition-colors">
                        <input type="checkbox" name="activo"
                            class="form-checkbox h-5 w-5 text-azul rounded bg-fondo border-linea focus:ring-azul focus:ring-offset-slate-900"
                            {% if usuario.activo %}checked{% endif %}>
                        <span class="text-grafito-900 font-medium">Usuario Activo</span>
                    </label>
                    <p class="text-xs text-grafito-500 mt-2 ml-1">Si se desactiva, el usuario no podrá iniciar sesión.</p>
                </div>
            </div>

            <div class="pt-6 border-t border-linea flex justify-end gap-4">
                <a href="{{ url_for('admin.listar_usuarios') }}"
                    class="px-6 py-2 rounded-lg text-grafito-500 hover:text-grafito-900 transition-colors">Cancelar</a>
                <button type="submit"
                    class="px-6 py-2 bg-azul hover:bg-azul text-white rounded-lg font-medium transition-all transform active:scale-95">
                    Guardar Cambios
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
