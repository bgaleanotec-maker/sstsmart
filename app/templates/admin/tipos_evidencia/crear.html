{% extends "admin/base.html" %}

{% block title %}Nuevo Tipo Evidencia - Admin SST{% endblock %}
{% block page_title %}Nuevo Tipo de Evidencia{% endblock %}

{% block content %}
<div class="max-w-2xl animate-fade-in">
    <div class="glass-card p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Nombre *</label>
                <input type="text" name="nombre" required
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-orange-500 focus:outline-none transition-colors"
                    placeholder="Ej: Acto Inseguro (RIESGO)">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Código</label>
                <input type="text" name="codigo"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-orange-500 focus:outline-none transition-colors"
                    placeholder="Ej: ACTO_INSEGURO_RIESGO">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Descripción</label>
                <textarea name="descripcion"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-white focus:border-orange-500 focus:outline-none transition-colors"
                    rows="3" placeholder="Describe este tipo de evidencia"></textarea>
            </div>

            <div class="flex gap-4 pt-4 border-t border-white/10">
                <button type="submit"
                    class="bg-orange-600 text-white px-6 py-2 rounded-lg hover:bg-orange-500 shadow-lg shadow-orange-500/20 font-medium transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-save mr-2"></i> Crear Tipo
                </button>
                <a href="{{ url_for('admin.listar_tipos_evidencia') }}"
                    class="px-6 py-2 rounded-lg text-slate-400 hover:text-white transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
