{% extends "admin/base.html" %}

{% block title %}Nuevo Tipo Evidencia - Admin SST{% endblock %}
{% block page_title %}Nuevo Tipo de Evidencia{% endblock %}

{% block admin_content %}
<div class="max-w-2xl">
    <div class="panel p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Nombre *</label>
                <input type="text" name="nombre" required
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-orange-500 focus:outline-none transition-colors"
                    placeholder="Ej: Acto Inseguro (RIESGO)">
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Código</label>
                <input type="text" name="codigo"
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-orange-500 focus:outline-none transition-colors"
                    placeholder="Ej: ACTO_INSEGURO_RIESGO">
            </div>

            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Descripción</label>
                <textarea name="descripcion"
                    class="w-full bg-fondo border border-linea rounded-lg p-3 text-grafito-900 focus:border-orange-500 focus:outline-none transition-colors"
                    rows="3" placeholder="Describe este tipo de evidencia"></textarea>
            </div>

            <div class="flex gap-4 pt-4 border-t border-linea">
                <button type="submit"
                    class="bg-rojo-suave text-grafito-900 px-6 py-2 rounded-lg hover:bg-rojo-suave font-medium transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-save mr-2"></i> Crear Tipo
                </button>
                <a href="{{ url_for('admin.listar_tipos_evidencia') }}"
                    class="px-6 py-2 rounded-lg text-grafito-500 hover:text-grafito-900 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
