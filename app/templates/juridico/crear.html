{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-6 max-w-2xl">
    <div class="mb-6">
        <a href="{{ url_for('juridico.listar') }}"
            class="text-grafito-500 hover:text-grafito-900 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Volver a consultas
        </a>
    </div>

    <div class="panel p-8">
        <h1 class="text-3xl font-bold mb-6 text-grafito-900 flex items-center gap-3">
            <span class="p-2 rounded-lg bg-azul-suave text-azul">
                <i class="fa-solid fa-scale-balanced"></i>
            </span>
            Nueva Consulta Jurídica
        </h1>

        <form method="POST" class="space-y-6">
            <!-- Título -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Título *</label>
                <input type="text" name="titulo" required class="modern-input"
                    placeholder="Ej: Accidente laboral en área de producción">
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Descripción *</label>
                <textarea name="descripcion" required rows="4" class="modern-input"
                    placeholder="Describe los detalles de la consulta..."></textarea>
            </div>

            <!-- Tipo de Consulta -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Tipo de Consulta *</label>
                <select name="tipo_consulta" required class="modern-input">
                    <option value="" class="bg-superficie">-- Selecciona tipo --</option>
                    <option value="Laboral" class="bg-superficie">Laboral</option>
                    <option value="Penal" class="bg-superficie">Penal</option>
                    <option value="Civil" class="bg-superficie">Civil</option>
                    <option value="Administrativo" class="bg-superficie">Administrativo</option>
                </select>
            </div>

            <!-- Grid de opciones -->
            <div class="grid grid-cols-2 gap-6">
                <!-- Prioridad -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-grafito-700">Prioridad</label>
                    <select name="prioridad" class="modern-input">
                        <option value="Baja" class="bg-superficie">Baja</option>
                        <option value="Normal" selected class="bg-superficie">Normal</option>
                        <option value="Alta" class="bg-superficie">Alta</option>
                        <option value="Crítica" class="bg-superficie">Crítica</option>
                    </select>
                </div>

                <!-- Riesgo Legal -->
                <div>
                    <label class="block text-sm font-semibold mb-2 text-grafito-700">Riesgo Legal</label>
                    <select name="riesgo_legal" class="modern-input">
                        <option value="Bajo" class="bg-superficie">Bajo</option>
                        <option value="Medio" selected class="bg-superficie">Medio</option>
                        <option value="Alto" class="bg-superficie">Alto</option>
                        <option value="Crítico" class="bg-superficie">Crítico</option>
                    </select>
                </div>
            </div>

            <!-- Confidencialidad -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Nivel de Confidencialidad</label>
                <select name="confidencialidad" class="modern-input">
                    <option value="Público" class="bg-superficie">Público</option>
                    <option value="Interno" selected class="bg-superficie">Interno</option>
                    <option value="Confidencial" class="bg-superficie">Confidencial</option>
                    <option value="Restringido" class="bg-superficie">Restringido (Datos médicos/sensibles)</option>
                </select>
            </div>

            <!-- Horas Estimadas -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Horas Estimadas de Consulta</label>
                <input type="number" name="horas_estimadas" step="0.5" min="0" class="modern-input" placeholder="Ej: 3">
            </div>

            <!-- Empleado Afectado (opcional) -->
            <div>
                <label class="block text-sm font-semibold mb-2 text-grafito-700">Empleado Afectado (opcional)</label>
                <select name="empleado_afectado_id" class="modern-input">
                    <option value="" class="bg-superficie">-- Sin empleado específico --</option>
                    {% for empleado in empleados %}
                    <option value="{{ empleado.id }}" class="bg-superficie">{{ empleado.nombre }} - {{ empleado.area }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Botones -->
            <div class="flex gap-4 pt-6">
                <button type="submit" class="flex-1 btn-primary">
                    <i class="fa-solid fa-check mr-2"></i> Crear Consulta
                </button>
                <a href="{{ url_for('juridico.listar') }}"
                    class="flex-1 px-6 py-3 rounded-lg border border-linea text-grafito-700 hover:bg-fondo hover:text-grafito-900 text-center transition-colors">
                     Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
