{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">

    <!-- Info Card -->
    <div class="panel p-6 mb-6">
        <h2 class="text-xl font-bold text-grafito-700 mb-2">Evaluación Jurídica Forense</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div>
                <p class="text-grafito-500">Norma</p>
                <p class="text-grafito-900 font-mono">{{ requisito.norma }}</p>
            </div>
            <div>
                <p class="text-grafito-500">Artículo</p>
                <p class="text-grafito-900 font-mono">{{ requisito.articulo }}</p>
            </div>
            <div class="col-span-2">
                <p class="text-grafito-500">Descripción</p>
                <p class="text-grafito-700">{{ requisito.descripcion }}</p>
            </div>
        </div>
    </div>

    <!-- Evaluation Form -->
    <div class="panel p-8 border-t-4 border-linea">
        <form method="POST" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Puntuación -->
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Nivel Cumplimiento
                        (0-100)</label>
                    <input type="number" name="puntuacion" min="0" max="100" required
                        class="w-full bg-fondo border border-linea rounded-lg p-4 text-grafito-900 text-center text-2xl font-bold focus:border-linea focus:outline-none"
                        placeholder="0">
                </div>

                <!-- Probabilidad Sanción -->
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Probabilidad Sanción</label>
                    <select name="probabilidad" required
                        class="w-full bg-fondo border border-linea rounded-lg p-4 text-grafito-900 focus:border-linea focus:outline-none">
                        <option value="BAJA"> Baja (x1)</option>
                        <option value="MEDIA"> Media (x2)</option>
                        <option value="ALTA"> Alta (x3)</option>
                    </select>
                </div>

                <!-- Impacto Financiero -->
                <div>
                    <label class="block text-sm font-bold text-grafito-500 mb-2">Impacto ($ COP)</label>
                    <input type="number" name="impacto" step="0.01" required
                        class="w-full bg-fondo border border-linea rounded-lg p-4 text-grafito-900 text-right focus:border-linea focus:outline-none"
                        placeholder="0.00">
                </div>
            </div>

            <!-- Concepto -->
            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Concepto Jurídico Final</label>
                <textarea name="concepto" required rows="5"
                    class="w-full bg-fondo border border-linea rounded-lg p-4 text-grafito-900 focus:border-linea focus:outline-none"
                    placeholder="Emitir concepto técnico-legal sobre el estado de cumplimiento..."></textarea>
            </div>

            <!-- Nuevo Estado -->
            <div>
                <label class="block text-sm font-bold text-grafito-500 mb-2">Dictamen de Estado</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="Pendiente" class="peer sr-only">
                        <div
                            class="bg-superficie p-3 rounded text-center text-grafito-500 ring-2 ring-transparent peer-checked:ring-slate-400 peer-checked:text-grafito-900 transition-all">
                            Pendiente
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="En Proceso" class="peer sr-only">
                        <div
                            class="bg-superficie p-3 rounded text-center text-azul ring-2 ring-transparent peer-checked:ring-azul peer-checked:bg-azul transition-all">
                            En Proceso
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="Cumple" class="peer sr-only">
                        <div
                            class="bg-superficie p-3 rounded text-center text-verde ring-2 ring-transparent peer-checked:ring-emerald-500 peer-checked:bg-verde transition-all">
                            Cumple
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="No Cumple" class="peer sr-only">
                        <div
                            class="bg-superficie p-3 rounded text-center text-rojo ring-2 ring-transparent peer-checked:ring-red-500 peer-checked:bg-rojo transition-all">
                            No Cumple
                        </div>
                    </label>
                </div>
            </div>

            <div class="flex gap-4 pt-6 border-t border-linea mt-6">
                <button type="submit"
                    class="bg-azul-suave hover:bg-azul-suave text-grafito-900 px-8 py-3 rounded-lg font-bold transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-gavel mr-2"></i> Emitir Concepto
                </button>
                <a href="{{ url_for('matriz_legal.dashboard') }}"
                    class="px-8 py-3 rounded-lg text-grafito-500 hover:text-grafito-900 hover:bg-superficie transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
