{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto animate-fade-in">

    <!-- Info Card -->
    <div class="glass-card p-6 mb-6">
        <h2 class="text-xl font-bold text-slate-300 mb-2">Evaluación Jurídica Forense</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            <div>
                <p class="text-slate-500 uppercase">Norma</p>
                <p class="text-white font-mono">{{ requisito.norma }}</p>
            </div>
            <div>
                <p class="text-slate-500 uppercase">Artículo</p>
                <p class="text-white font-mono">{{ requisito.articulo }}</p>
            </div>
            <div class="col-span-2">
                <p class="text-slate-500 uppercase">Descripción</p>
                <p class="text-slate-300">{{ requisito.descripcion }}</p>
            </div>
        </div>
    </div>

    <!-- Evaluation Form -->
    <div class="glass-card p-8 border-t-4 border-indigo-500">
        <form method="POST" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Puntuación -->
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Nivel Cumplimiento
                        (0-100)</label>
                    <input type="number" name="puntuacion" min="0" max="100" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-4 text-white text-center text-2xl font-bold focus:border-indigo-500 focus:outline-none"
                        placeholder="0">
                </div>

                <!-- Probabilidad Sanción -->
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Probabilidad Sanción</label>
                    <select name="probabilidad" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-4 text-white focus:border-indigo-500 focus:outline-none">
                        <option value="BAJA">🟢 Baja (x1)</option>
                        <option value="MEDIA">🟡 Media (x2)</option>
                        <option value="ALTA">🔴 Alta (x3)</option>
                    </select>
                </div>

                <!-- Impacto Financiero -->
                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Impacto ($ COP)</label>
                    <input type="number" name="impacto" step="0.01" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-4 text-white text-right focus:border-indigo-500 focus:outline-none"
                        placeholder="0.00">
                </div>
            </div>

            <!-- Concepto -->
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Concepto Jurídico Final</label>
                <textarea name="concepto" required rows="5"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-4 text-white focus:border-indigo-500 focus:outline-none"
                    placeholder="Emitir concepto técnico-legal sobre el estado de cumplimiento..."></textarea>
            </div>

            <!-- Nuevo Estado -->
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase">Dictamen de Estado</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="Pendiente" class="peer sr-only">
                        <div
                            class="bg-slate-800 p-3 rounded text-center text-slate-400 ring-2 ring-transparent peer-checked:ring-slate-400 peer-checked:text-white transition-all">
                            Pendiente
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="En Proceso" class="peer sr-only">
                        <div
                            class="bg-slate-800 p-3 rounded text-center text-blue-400 ring-2 ring-transparent peer-checked:ring-blue-500 peer-checked:bg-blue-900 transition-all">
                            En Proceso
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="Cumple" class="peer sr-only">
                        <div
                            class="bg-slate-800 p-3 rounded text-center text-emerald-400 ring-2 ring-transparent peer-checked:ring-emerald-500 peer-checked:bg-emerald-900 transition-all">
                            Cumple
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estado" value="No Cumple" class="peer sr-only">
                        <div
                            class="bg-slate-800 p-3 rounded text-center text-red-400 ring-2 ring-transparent peer-checked:ring-red-500 peer-checked:bg-red-900 transition-all">
                            No Cumple
                        </div>
                    </label>
                </div>
            </div>

            <div class="flex gap-4 pt-6 border-t border-slate-700 mt-6">
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-lg shadow-lg shadow-indigo-500/20 font-bold transition-all transform active:scale-95 flex items-center">
                    <i class="fas fa-gavel mr-2"></i> Emitir Concepto
                </button>
                <a href="{{ url_for('matriz_legal.dashboard') }}"
                    class="px-8 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
