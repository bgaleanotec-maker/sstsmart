{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="panel p-8">
        <div class="flex items-center justify-between mb-8 border-b border-linea pb-4">
            <div>
                <h1 class="text-2xl font-bold text-grafito-900">{{ examen.titulo }}</h1>
                <p class="text-grafito-500 text-sm">Responde todas las preguntas atentamente</p>
            </div>
            <div class="bg-azul-suave px-4 py-2 rounded border border-azul text-azul">
                <i class="fa-solid fa-clock mr-2"></i> Sin límite de tiempo
            </div>
        </div>

        <form method="POST" action="{{ url_for('formacion.tomar_examen', examen_id=examen.id) }}">
            <div class="space-y-8">
                {% for pregunta in examen.preguntas %}
                <div class="bg-superficie p-6 rounded-lg border border-linea">
                    <p class="font-bold text-lg text-grafito-900 mb-4">
                        <span class="text-azul mr-2">{{ loop.index }}.</span> {{ pregunta.texto_pregunta }}
                    </p>

                    <div class="space-y-3">
                        {% for opcion in pregunta.opciones %}
                        <label
                            class="flex items-center p-3 rounded-lg hover:bg-fondo cursor-pointer transition-colors border border-transparent hover:border-linea">
                            <input type="radio" name="pregunta_{{ pregunta.id }}" value="{{ opcion.id }}"
                                class="w-4 h-4 text-azul focus:ring-azul bg-fondo border-linea"
                                required>
                            <span class="ml-3 text-grafito-700">{{ opcion.texto_opcion }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="mt-8 flex justify-end">
                <button type="submit" class="btn-primary flex items-center gap-2 text-lg px-8 py-3">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Respuestas
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
