{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto animate-fade-in">
    <div class="glass-card p-8">
        <div class="flex items-center justify-between mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">{{ examen.titulo }}</h1>
                <p class="text-slate-400 text-sm">Responde todas las preguntas atentamente</p>
            </div>
            <div class="bg-blue-900/50 px-4 py-2 rounded border border-blue-500/30 text-blue-300">
                <i class="fa-solid fa-clock mr-2"></i> Sin límite de tiempo
            </div>
        </div>

        <form method="POST" action="{{ url_for('formacion.tomar_examen', examen_id=examen.id) }}">
            <div class="space-y-8">
                {% for pregunta in examen.preguntas %}
                <div class="bg-slate-800/30 p-6 rounded-xl border border-slate-700">
                    <p class="font-bold text-lg text-white mb-4">
                        <span class="text-blue-500 mr-2">{{ loop.index }}.</span> {{ pregunta.texto_pregunta }}
                    </p>

                    <div class="space-y-3">
                        {% for opcion in pregunta.opciones %}
                        <label
                            class="flex items-center p-3 rounded-lg hover:bg-slate-700/50 cursor-pointer transition-colors border border-transparent hover:border-slate-600">
                            <input type="radio" name="pregunta_{{ pregunta.id }}" value="{{ opcion.id }}"
                                class="w-4 h-4 text-blue-600 focus:ring-blue-500 bg-slate-700 border-slate-600"
                                required>
                            <span class="ml-3 text-slate-300">{{ opcion.texto_opcion }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="mt-8 flex justify-end">
                <button type="submit" class="btn-primary flex items-center gap-2 text-lg px-8 py-3">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Respuestas
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
